<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a24">
  <title>混沌双摆 | Week 05</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1a1a24;
      --panel: #22232e;
      --raised: #292a36;
      --line: #3b3d49;
      --muted: #9699a9;
      --text: #ececf0;
      --cyan: #56d7df;
      --amber: #ffb45e;
      font-family: "Bahnschrift", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(ellipse at 50% 0%, #30313c 0%, transparent 60%),
        linear-gradient(135deg, transparent 0 49.8%, #ffffff05 50%, transparent 50.2%);
      background-size: auto, 34px 34px;
    }

    button { font: inherit; }

    .app {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 28px;
      animation: appear 450ms ease-out both;
    }

    .topline, .heading, .stage-top, .toolbar, .readouts, .readout {
      display: flex;
      align-items: center;
    }

    .topline, .heading, .stage-top, .toolbar { justify-content: space-between; }

    .topline { margin-bottom: 22px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.1px;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid #56d7df66;
      border-radius: 50%;
      color: var(--cyan);
      font-size: 17px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8bddaa;
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: .8px;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
      content: "";
    }

    .heading { gap: 20px; margin-bottom: 18px; }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--amber);
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1.3px;
    }

    h1 { margin: 0; font-size: 28px; font-weight: 600; }

    .heading-note { margin: 0 0 3px; color: var(--muted); font-size: 12px; }

    .workbench {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #20212bbf;
      box-shadow: 0 24px 70px #0003, 0 1px 0 #ffffff08 inset;
    }

    .stage {
      position: relative;
      background: radial-gradient(ellipse at 50% 45%, #292b37 0%, #1e1f29 72%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 540px;
      touch-action: none;
      cursor: grab;
    }

    canvas.dragging { cursor: grabbing; }

    .stage-top {
      position: absolute;
      z-index: 1;
      top: 17px;
      right: 20px;
      left: 20px;
      pointer-events: none;
    }

    .stage-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b9bbc7;
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: .9px;
    }

    .stage-tag span {
      padding: 5px 7px;
      border: 1px solid #56d7df45;
      border-radius: 3px;
      color: var(--cyan);
    }

    .stage-meta { color: #777a89; font-family: Consolas, monospace; font-size: 10px; }

    .readouts {
      gap: 0;
      border-top: 1px solid var(--line);
      background: #1d1e27;
    }

    .readout {
      flex: 1;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      padding: 15px 20px 16px;
    }

    .readout + .readout { border-left: 1px solid var(--line); }

    .readout-label {
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
      letter-spacing: .65px;
    }

    .readout-value { font-size: 17px; font-variant-numeric: tabular-nums; }
    .readout-value small { margin-left: 4px; color: var(--muted); font-size: 11px; }

    .toolbar {
      gap: 18px;
      padding: 17px 20px;
      border-top: 1px solid var(--line);
      background: #24252f;
    }

    .model-label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
      letter-spacing: .5px;
    }

    .model-label strong { color: var(--amber); font-size: 12px; font-weight: 500; letter-spacing: 0; }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; }

    .button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid #56d7df66;
      border-radius: 4px;
      color: #122326;
      background: var(--cyan);
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .button:hover { background: #7be7eb; }
    .button:active { transform: translateY(1px); }

    .button.secondary {
      border-color: var(--line);
      color: var(--text);
      background: var(--raised);
    }

    .button.secondary:hover { border-color: #777a89; }

    .button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .app { width: min(100% - 24px, 520px); padding-top: 20px; }
      .heading { align-items: flex-start; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      h1 { font-size: 25px; }
      canvas { height: 470px; }
      .readout { padding: 13px 10px; }
      .readout-label { font-size: 8px; }
      .readout-value { font-size: 15px; }
      .toolbar { align-items: flex-start; flex-direction: column; padding: 15px; }
      .actions { width: 100%; }
      .actions .button { flex: 1; }
    }

    @media (max-width: 380px) {
      .status { font-size: 9px; }
      .readout { padding-inline: 7px; }
      .readout-value { font-size: 14px; }
      .stage-top { right: 12px; left: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">∞</span> Dynamics Lab <span>/</span> 05</div>
      <div class="status" id="status">CHAOTIC SYSTEM · RUNNING</div>
    </div>

    <header class="heading">
      <div>
        <p class="eyebrow">NONLINEAR DYNAMICS · EXPERIMENT 05</p>
        <h1>混沌双摆</h1>
      </div>
      <p class="heading-note">双臂耦合 · 四阶 Runge–Kutta 积分</p>
    </header>

    <section class="workbench" aria-label="混沌双摆模拟器">
      <div class="stage">
        <div class="stage-top">
          <div class="stage-tag"><span>RK4</span> DOUBLE PENDULUM</div>
          <div class="stage-meta" id="timeReadout">T + 0.00 s</div>
        </div>
        <canvas id="pendulum" aria-label="可拖拽的双摆模拟画布"></canvas>
      </div>
      <div class="readouts" aria-live="polite">
        <div class="readout">
          <span class="readout-label">上摆角 / θ₁</span>
          <span class="readout-value"><span id="angleOne">120.0</span><small>°</small></span>
        </div>
        <div class="readout">
          <span class="readout-label">下摆角 / θ₂</span>
          <span class="readout-value"><span id="angleTwo">-10.0</span><small>°</small></span>
        </div>
        <div class="readout">
          <span class="readout-label">总能量 / E</span>
          <span class="readout-value"><span id="energyReadout">0.00</span><small>J</small></span>
        </div>
      </div>
      <div class="toolbar">
        <div class="model-label"><span>MODEL</span><strong>m₁ = 1.0 kg · m₂ = 1.0 kg · g = 9.81 m/s²</strong></div>
        <div class="actions">
          <button class="button" id="toggle" type="button"><span id="toggleIcon" aria-hidden="true">Ⅱ</span><span id="toggleText">暂停</span></button>
          <button class="button secondary" id="reset" type="button"><span aria-hidden="true">↺</span><span>重置</span></button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("pendulum");
    const context = canvas.getContext("2d");
    const gravity = 9.81;
    const massOne = 1;
    const massTwo = 1;
    const lengthOne = 1.2;
    const lengthTwo = 1.2;
    const fixedStep = 1 / 240;
    const initialState = [120 * Math.PI / 180, -10 * Math.PI / 180, 0, 0];
    const trailDuration = 2.6;

    let state = [...initialState];
    let running = true;
    let simTime = 0;
    let previousTime = 0;
    let accumulator = 0;
    let canvasWidth = 0;
    let canvasHeight = 0;
    let deviceScale = 1;
    let dragIndex = -1;
    let trail = [];
    let lastTrailTime = 0;

    function derivative(values) {
      const [thetaOne, thetaTwo, omegaOne, omegaTwo] = values;
      const difference = thetaOne - thetaTwo;
      const denominator = 2 * massOne + massTwo - massTwo * Math.cos(2 * difference);
      const alphaOne = (
        -gravity * (2 * massOne + massTwo) * Math.sin(thetaOne)
        - massTwo * gravity * Math.sin(thetaOne - 2 * thetaTwo)
        - 2 * Math.sin(difference) * massTwo
          * (omegaTwo * omegaTwo * lengthTwo + omegaOne * omegaOne * lengthOne * Math.cos(difference))
      ) / (lengthOne * denominator);
      const alphaTwo = (
        2 * Math.sin(difference)
        * (omegaOne * omegaOne * lengthOne * (massOne + massTwo)
          + gravity * (massOne + massTwo) * Math.cos(thetaOne)
          + omegaTwo * omegaTwo * lengthTwo * massTwo * Math.cos(difference))
      ) / (lengthTwo * denominator);
      return [omegaOne, omegaTwo, alphaOne, alphaTwo];
    }

    function combine(base, terms) {
      return base.map((value, index) => value + terms.reduce((sum, [weight, slope]) => sum + weight * slope[index], 0));
    }

    function integrateRK4(step) {
      const k1 = derivative(state);
      const k2 = derivative(combine(state, [[step / 2, k1]]));
      const k3 = derivative(combine(state, [[step / 2, k2]]));
      const k4 = derivative(combine(state, [[step, k3]]));
      state = combine(state, [[step / 6, k1], [step / 3, k2], [step / 3, k3], [step / 6, k4]]);
      state[0] = Math.atan2(Math.sin(state[0]), Math.cos(state[0]));
      state[1] = Math.atan2(Math.sin(state[1]), Math.cos(state[1]));
      if (!state.every(Number.isFinite)) resetSimulation();
    }

    function getGeometry() {
      const anchor = { x: canvasWidth / 2, y: 83 };
      const availableHalfWidth = Math.max(30, canvasWidth / 2 - 30);
      const scale = Math.min(125, availableHalfWidth / (lengthOne + lengthTwo));
      const first = {
        x: anchor.x + Math.sin(state[0]) * lengthOne * scale,
        y: anchor.y + Math.cos(state[0]) * lengthOne * scale
      };
      const second = {
        x: first.x + Math.sin(state[1]) * lengthTwo * scale,
        y: first.y + Math.cos(state[1]) * lengthTwo * scale
      };
      return { anchor, first, second, scale };
    }

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      deviceScale = Math.min(window.devicePixelRatio || 1, 2);
      canvasWidth = bounds.width;
      canvasHeight = bounds.height;
      canvas.width = Math.round(canvasWidth * deviceScale);
      canvas.height = Math.round(canvasHeight * deviceScale);
      context.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
      draw(performance.now());
    }

    function drawTrail(now, point) {
      if (now - lastTrailTime >= 1000 / 60) {
        trail.push({ ...point, time: now, hue: (now * 0.055) % 360 });
        lastTrailTime = now;
      }
      trail = trail.filter(entry => now - entry.time < trailDuration * 1000);
      context.lineCap = "round";
      context.lineWidth = 2.5;
      for (let index = 1; index < trail.length; index += 1) {
        const previous = trail[index - 1];
        const current = trail[index];
        const age = now - current.time;
        context.globalAlpha = Math.max(0, 1 - age / (trailDuration * 1000)) * 0.8;
        context.strokeStyle = `hsl(${current.hue} 92% 67%)`;
        context.beginPath();
        context.moveTo(previous.x, previous.y);
        context.lineTo(current.x, current.y);
        context.stroke();
      }
      context.globalAlpha = 1;
    }

    function draw(now = performance.now()) {
      context.clearRect(0, 0, canvasWidth, canvasHeight);
      const { anchor, first, second } = getGeometry();

      context.save();
      context.strokeStyle = "#ffffff12";
      context.lineWidth = 1;
      context.setLineDash([3, 8]);
      context.beginPath();
      context.moveTo(anchor.x, 48);
      context.lineTo(anchor.x, canvasHeight - 24);
      context.stroke();
      context.restore();

      drawTrail(now, second);

      context.strokeStyle = "#a9acba";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(anchor.x, anchor.y);
      context.lineTo(first.x, first.y);
      context.lineTo(second.x, second.y);
      context.stroke();

      context.fillStyle = "#c5c8d2";
      context.beginPath();
      context.arc(anchor.x, anchor.y, 6, 0, Math.PI * 2);
      context.fill();

      drawBob(first, 14, "#56d7df", "#d9ffff", "#168b99");
      drawBob(second, 13, "#ffb45e", "#fff0d6", "#da704e");
      updateReadouts();
    }

    function drawBob(point, radius, glowColor, highlight, shadow) {
      const glow = context.createRadialGradient(point.x, point.y, 2, point.x, point.y, radius * 2.8);
      glow.addColorStop(0, `${glowColor}99`);
      glow.addColorStop(1, `${glowColor}00`);
      context.fillStyle = glow;
      context.beginPath();
      context.arc(point.x, point.y, radius * 2.8, 0, Math.PI * 2);
      context.fill();

      const metal = context.createRadialGradient(point.x - 5, point.y - 6, 1, point.x, point.y, radius);
      metal.addColorStop(0, highlight);
      metal.addColorStop(0.35, glowColor);
      metal.addColorStop(1, shadow);
      context.fillStyle = metal;
      context.beginPath();
      context.arc(point.x, point.y, radius, 0, Math.PI * 2);
      context.fill();
    }

    function totalEnergy() {
      const [thetaOne, thetaTwo, omegaOne, omegaTwo] = state;
      const kinetic = 0.5 * (massOne + massTwo) * lengthOne ** 2 * omegaOne ** 2
        + 0.5 * massTwo * lengthTwo ** 2 * omegaTwo ** 2
        + massTwo * lengthOne * lengthTwo * omegaOne * omegaTwo * Math.cos(thetaOne - thetaTwo);
      const potential = -(massOne + massTwo) * gravity * lengthOne * Math.cos(thetaOne)
        - massTwo * gravity * lengthTwo * Math.cos(thetaTwo);
      return kinetic + potential;
    }

    function updateReadouts() {
      document.getElementById("angleOne").textContent = (state[0] * 180 / Math.PI).toFixed(1);
      document.getElementById("angleTwo").textContent = (state[1] * 180 / Math.PI).toFixed(1);
      document.getElementById("energyReadout").textContent = totalEnergy().toFixed(2);
      document.getElementById("timeReadout").textContent = `T + ${simTime.toFixed(2)} s`;
    }

    function frame(timestamp) {
      if (!previousTime) previousTime = timestamp;
      const elapsed = Math.min((timestamp - previousTime) / 1000, 0.04);
      previousTime = timestamp;
      if (running && dragIndex < 0) {
        accumulator += elapsed;
        while (accumulator >= fixedStep) {
          integrateRK4(fixedStep);
          accumulator -= fixedStep;
          simTime += fixedStep;
        }
      }
      draw(timestamp);
      requestAnimationFrame(frame);
    }

    function resetSimulation() {
      state = [...initialState];
      simTime = 0;
      accumulator = 0;
      trail = [];
      lastTrailTime = 0;
      draw(performance.now());
    }

    function pointerPosition(event) {
      const bounds = canvas.getBoundingClientRect();
      return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
    }

    function angleFromVertical(origin, point) {
      return Math.atan2(point.x - origin.x, point.y - origin.y);
    }

    canvas.addEventListener("pointerdown", event => {
      const point = pointerPosition(event);
      const { first, second } = getGeometry();
      const distanceOne = Math.hypot(point.x - first.x, point.y - first.y);
      const distanceTwo = Math.hypot(point.x - second.x, point.y - second.y);
      if (Math.min(distanceOne, distanceTwo) > 34) return;
      dragIndex = distanceOne <= distanceTwo ? 0 : 1;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(event.pointerId);
      trail = [];
      state[2] = 0;
      state[3] = 0;
      event.preventDefault();
    });

    canvas.addEventListener("pointermove", event => {
      if (dragIndex < 0) return;
      const point = pointerPosition(event);
      if (dragIndex === 0) {
        state[0] = angleFromVertical(getGeometry().anchor, point);
      } else {
        state[1] = angleFromVertical(getGeometry().first, point);
      }
      state[2] = 0;
      state[3] = 0;
      trail = [];
      draw(performance.now());
    });

    function releasePointer() {
      if (dragIndex < 0) return;
      dragIndex = -1;
      canvas.classList.remove("dragging");
      state[2] = 0;
      state[3] = 0;
      accumulator = 0;
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);
    document.getElementById("reset").addEventListener("click", resetSimulation);
    document.getElementById("toggle").addEventListener("click", () => {
      running = !running;
      document.getElementById("toggle").setAttribute("aria-pressed", String(!running));
      document.getElementById("toggleIcon").textContent = running ? "Ⅱ" : "▶";
      document.getElementById("toggleText").textContent = running ? "暂停" : "继续";
      document.getElementById("status").textContent = running ? "CHAOTIC SYSTEM · RUNNING" : "CHAOTIC SYSTEM · PAUSED";
      document.getElementById("status").style.color = running ? "#8bddaa" : "var(--amber)";
    });
    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
